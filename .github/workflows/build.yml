name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: build-mac
            artifact: mac
          - os: windows-latest
            target: build-windows
            artifact: windows
          - os: ubuntu-latest
            target: build-linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install make
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - name: Build
        run: make ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencoder-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
