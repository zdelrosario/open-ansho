name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install make
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - name: Run tests
        run: make test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: build-mac
            artifact: mac
          - os: windows-latest
            target: build-windows
            artifact: windows
          - os: ubuntu-latest
            target: build-linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install make
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - name: Build
        run: make ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencoder-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # Persists every build's output to the `builds` branch so it survives past
  # the 90-day artifact retention window. Only runs for pushes to main (not
  # pull_request), since a PR's build shouldn't be written to a shared,
  # permanent branch and forked PRs don't have write-token permissions anyway.
  cache-builds:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencoder-*
          path: artifacts

      - name: Commit builds to the builds branch
        run: |
          set -euo pipefail

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REPO_DIR="$(mktemp -d)"

          if git clone --quiet --depth 1 --branch builds "$REMOTE" "$REPO_DIR" 2>/dev/null; then
            :
          else
            git -C "$REPO_DIR" init --quiet
            git -C "$REPO_DIR" checkout --quiet --orphan builds
          fi

          git -C "$REPO_DIR" config user.name "github-actions[bot]"
          git -C "$REPO_DIR" config user.email "github-actions[bot]@users.noreply.github.com"

          DEST="$REPO_DIR/runs/${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          mkdir -p "$DEST"
          cp -r artifacts/opencoder-mac "$DEST/mac"
          cp -r artifacts/opencoder-windows "$DEST/windows"
          cp -r artifacts/opencoder-linux "$DEST/linux"

          git -C "$REPO_DIR" add -A
          git -C "$REPO_DIR" commit --quiet -m "Build for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git -C "$REPO_DIR" push --quiet "$REMOTE" HEAD:builds
        env:
          GH_TOKEN: ${{ github.token }}
