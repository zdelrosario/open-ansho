name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install make
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - name: Run tests
        run: make test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: build-mac
            artifact: mac
          - os: windows-latest
            target: build-windows
            artifact: windows
          - os: ubuntu-latest
            target: build-linux
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0

      - name: Install make
        if: matrix.os == 'windows-latest'
        run: choco install make -y

      - name: Build
        run: make ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: opencoder-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # Rotates each build's output onto the `builds` branch, keeping only the
  # KEEP_BUILDS most recent runs so the branch doesn't grow unbounded. Each
  # push replaces the branch with a fresh single-commit orphan tree (rather
  # than adding a commit on top), so old build blobs don't pile up in git
  # history either. Only runs for pushes to main (not pull_request), since a
  # PR's build shouldn't be written to a shared branch, and forked PRs don't
  # have write-token permissions anyway.
  rotate-builds:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencoder-*
          path: artifacts

      - name: Rotate builds onto the builds branch
        run: |
          set -euo pipefail

          KEEP_BUILDS=5
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          REPO_DIR="$(mktemp -d)"

          if ! git clone --quiet --depth 1 --branch builds "$REMOTE" "$REPO_DIR" 2>/dev/null; then
            git -C "$REPO_DIR" init --quiet
          fi

          git -C "$REPO_DIR" config user.name "github-actions[bot]"
          git -C "$REPO_DIR" config user.email "github-actions[bot]@users.noreply.github.com"

          DEST="$REPO_DIR/runs/${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          mkdir -p "$DEST"
          cp -r artifacts/opencoder-mac "$DEST/mac"
          cp -r artifacts/opencoder-windows "$DEST/windows"
          cp -r artifacts/opencoder-linux "$DEST/linux"

          mkdir -p "$REPO_DIR/runs"
          TOTAL=$(ls -1 "$REPO_DIR/runs" | wc -l | tr -d ' ')
          if [ "$TOTAL" -gt "$KEEP_BUILDS" ]; then
            DROP=$((TOTAL - KEEP_BUILDS))
            (cd "$REPO_DIR/runs" && ls -1 | sort -t- -k1,1n | sed -n "1,${DROP}p" | xargs -r rm -rf)
          fi

          cd "$REPO_DIR"
          git checkout --quiet --orphan builds-next
          git add -A
          git commit --quiet -m "Build for ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER})"
          git push --quiet --force "$REMOTE" builds-next:builds
        env:
          GH_TOKEN: ${{ github.token }}
