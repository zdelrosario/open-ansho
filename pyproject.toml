[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencoder"
version = "0.1.0"
description = "Open-source qualitative data analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
opencoder = "opencoder.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
